name: Check, test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moon.sh
          bash /tmp/install-moon.sh '0.10.17+093cb8f9c'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check and test all backends
        run: |
          moon version --all
          moon fmt --check
          moon check --deny-warn --target all
          moon test --deny-warn --target wasm-gc
          moon test --deny-warn --target js
          moon test --deny-warn --target wasm
          moon test --deny-warn --target native
          moon run cmd/demo
          moon info
          git diff --exit-code -- '*.mbti'
      - name: Build and test complete workflows
        run: |
          python3 scripts/import-public-data.py
          python3 scripts/import-foofah.py
          git diff --exit-code -- fixtures/ examples/
          node scripts/build.mjs
          node scripts/integration.mjs
          node scripts/advanced-test.mjs
          node scripts/regex-extended-test.mjs
          node scripts/regex-robustness-test.mjs
          node scripts/record-pivot-test.mjs
          node scripts/intent-test.mjs
          node scripts/record-lists-test.mjs
          node scripts/table-comparison-test.mjs
          node scripts/layouts-test.mjs
          node scripts/table-probe-test.mjs
          node scripts/assisted-diagnostic.mjs
          node scripts/audit-remaining.mjs
          node scripts/multisource-test.mjs
          python3 scripts/generate-decimal-oracle.py
          node scripts/decimal-test.mjs
          node scripts/confirmed-test.mjs
          node scripts/data-job-test.mjs
          node scripts/join-learning-test.mjs
          python3 scripts/generate-sort-oracle.py
          node scripts/sorting-test.mjs
          node scripts/public-data-test.mjs
          python3 scripts/verify-sqlite.py
          python3 scripts/verify-grouping.py
          node scripts/benchmark.mjs
          node scripts/audit-table-order.mjs
          python3 scripts/import-autotables.py
          node scripts/autotables-benchmark.mjs
          TABLE_INTENT=transpose_all AUTO_BENCHMARK_RESULTS=artifacts/autotables/assisted.json node scripts/autotables-benchmark.mjs
      - name: External string-task benchmark
        run: |
          python3 scripts/import-sygus.py
          python3 scripts/audit-string-benchmark.py
          node scripts/benchmark-strings.mjs
      - name: PCRE2 reference checks
        run: |
          python3 -m venv /tmp/exampleloom-pcre2-env
          /tmp/exampleloom-pcre2-env/bin/pip install pcre2==0.6.0
          /tmp/exampleloom-pcre2-env/bin/python scripts/generate-pcre2-oracle.py
          node scripts/pcre2-oracle-test.mjs
      - name: Independent pandas reference validation
        run: |
          python3 -m venv /tmp/exampleloom-oracle-env
          /tmp/exampleloom-oracle-env/bin/pip install pandas==3.1.0
          /tmp/exampleloom-oracle-env/bin/python scripts/generate-oracle-cases.py
          node scripts/oracle-test.mjs
      - name: Browser workflows
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          # Hosted Ubuntu 24.04 already includes Chrome and its libraries.
          # Prefer it to avoid an unnecessary apt update during transient DNS
          # failures; fall back to Playwright's pinned browser when absent.
          if command -v google-chrome >/dev/null 2>&1; then
            export BROWSER_EXECUTABLE="$(command -v google-chrome)"
            "$BROWSER_EXECUTABLE" --version
          else
            timeout 180s npx playwright install --with-deps chromium
          fi
          node scripts/serve.mjs > /tmp/exampleloom-server.log 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 --max-time 30 http://127.0.0.1:4173/ > /dev/null
          node scripts/browser-test.mjs
          node scripts/advanced-browser-test.mjs
          node scripts/browser-recovery-test.mjs
          node scripts/table-comparison-browser-test.mjs
          node scripts/table-probe-browser-test.mjs
          node scripts/sorting-browser-test.mjs
          node scripts/confirmed-browser-test.mjs
          node scripts/data-job-browser-test.mjs
          node scripts/join-learning-browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            artifacts/
            !artifacts/sygus-2017/**
            !artifacts/auto-tables-reference.zip
            !artifacts/autotables/tasks.json
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy workbench
        id: deployment
        uses: actions/deploy-pages@v4
